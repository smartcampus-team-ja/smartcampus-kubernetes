<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SmartCampus</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>

<body>
    <header>
        <h1>SmartCampus</h1>
        <p>Gestión de aulas y reservas universitarias</p>
    </header>

    <main>
        <section>
            <h2>Aulas disponibles</h2>

            <button id="load-rooms">
                Cargar aulas
            </button>

            <p id="rooms-status"></p>
            <div id="rooms"></div>
        </section>

        <section>
            <h2>Reservas</h2>

            <button id="load-bookings">
                Cargar reservas
            </button>

            <p id="bookings-status"></p>
            <div id="bookings"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
